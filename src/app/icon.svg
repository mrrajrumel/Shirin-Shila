<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0e1c"/>
      <stop offset="100%" stop-color="#0a0509"/>
    </radialGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b95"/>
      <stop offset="100%" stop-color="#ff3f79"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="100%" stop-color="#e09f3e"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Badge Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#pinkGrad)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.75" stroke-dasharray="2, 2"/>
  
  <!-- Star Crest Accent -->
  <polygon points="32,9 33.5,13 37.5,13.5 34.5,16 35.5,20 32,17.8 28.5,20 29.5,16 26.5,13.5 30.5,13" fill="url(#goldGrad)"/>
  
  <!-- Monogram SS (Shirin Shila) -->
  <text x="32" y="44" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="900" fill="url(#pinkGrad)" text-anchor="middle" letter-spacing="1">SS</text>
  
  <!-- Subtle cinema crown dots -->
  <circle cx="21" cy="48" r="1.2" fill="#ffd56b"/>
  <circle cx="32" cy="50" r="1.5" fill="#ffd56b"/>
  <circle cx="43" cy="48" r="1.2" fill="#ffd56b"/>
</svg>

